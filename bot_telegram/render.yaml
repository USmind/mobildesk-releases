services:
  - type: web
    name: mobildesk-keybot
    env: python
    buildCommand: ""
    startCommand: python main.py
    # IMPORTANTE: los secretos NO van hardcodeados aqui.
    # Configura en Render Dashboard > Environment las claves:
    #   BOT_TOKEN            = <token nuevo de BotFather>
    #   PASSWORD_AUTORIZACION = <contrasena de administracion>
    #   MASTER_SECRET         = <secreto aleatorio largo>
    #   LICENSE_API_KEY       = <clave del endpoint /activar>
    envVars:
      - key: MASTER_SECRET
        sync: false
      - key: LICENSE_API_KEY
        sync: false
